# How the desktop app is packaged.
#
# In its own file rather than a `build` key in `package.json`, because that file
# is the VSCode extension manifest and already carries a `contributes` block, an
# `engines.vscode` and fifteen command declarations. Two products' metadata in
# one document is how they start getting edited into each other.
#
# `extraMetadata.main` is the important line. Electron reads `main` from
# `package.json` exactly as VSCode does, and there it points at the extension
# host bundle — the app would load the extension and die on its first `require
# ('vscode')`. This overrides it inside the packaged copy only; the dev scripts
# sidestep the same problem by passing the entry on the command line.

appId: com.hammonjj.agentwrangler
productName: Agent Wrangler
copyright: Copyright © 2026 James Hammond

extraMetadata:
  main: dist/electron/main.js

directories:
  output: release
  buildResources: build

# Only what the app actually runs. Everything is bundled by esbuild — the one
# external is `electron` itself, which comes from the runtime — so `node_modules`
# is deliberately absent rather than shipped and unused. Listing `files` at all
# is what excludes it.
files:
  - dist/electron/**
  - dist/webview/**
  # The session host. It runs from a clone of the installed bundle, on the
  # bundled Node (`Resources/node`, below), not on the Electron binary (#129).
  - dist/sessionHost/**
  # The remote daemon (#74), run by launchd from the same clone the same way.
  - dist/remoteDaemon/**
  # The core daemon (#130), run by launchd from the same clone the same way.
  - dist/daemon/**
  # The `aw` CLI (#21), run by bin/aw on the installed bundle's Node.
  - dist/cli/**
  # Qualification stage 2's scratch-repo fixtures (plan §19.6), copied out of
  # the asar into a temp dir for each run.
  - dist/qualification-fixtures/**
  - build/icon.png

asar: true

# Plain Node cannot read app.asar, so the four programs the bundled Node runs
# are unpacked beside it: `Resources/app.asar.unpacked/dist/<name>/main.js`.
# The Electron main process still reaches them through the asar paths.
# The qualification fixtures too: the core daemon (#130) runs `createApp`,
# which copies them out per run. (`dist/webview` joins them when the daemon
# serves the browser workbench.)
asarUnpack:
  - dist/sessionHost/**
  - dist/remoteDaemon/**
  - dist/daemon/**
  - dist/cli/**
  - dist/qualification-fixtures/**

# The pinned official Node (#129, decision D1), staged in `.node-runtime/` by
# scripts/fetch-node.mjs, which `npm run app:package` runs first. Ends up at
# `Contents/Resources/node/bin/node` and is signed with the bundle.
#
# The RunAsNode fuse (Electron's default; nothing here sets `electronFuses`)
# is no longer needed by session hosts, the remote daemon or `aw`. Two things
# still use the app binary as Node, so if fuses are ever configured,
# `runAsNode: true` must stay until Electron is retired:
# - the agent-task qualification checks (`taskQualifier.ts`) run their `node`
#   steps on `process.execPath` with ELECTRON_RUN_AS_NODE;
# - hosts and the remote daemon fall back to it when a bundle has no
#   `Resources/node` (sessionHostRuntime.ts). Hosts started by builds before
#   #129 run on their own clone's binary and need nothing from this build.
extraResources:
  - from: .node-runtime
    to: node
    filter:
      - bin/node
      - LICENSE

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  # A local build for one machine, not something distributed: signed with a
  # self-signed certificate from the login keychain, unnotarized. Create it once
  # per machine with `npm run app:signing-setup` (scripts/setup-signing-cert.sh).
  #
  # Why not ad-hoc (`-`): macOS privacy grants — Screen Recording,
  # Accessibility, the microphone — are pinned to the app's designated
  # requirement, and an ad-hoc signature's requirement is that build's code
  # hash. Every rebuild made every earlier grant stale while System Settings
  # still showed it switched on (#56). A certificate makes the requirement
  # "this bundle id, signed by this certificate", which survives rebuilds.
  #
  # Why not `identity: null`: that means "skip signing", which leaves the
  # bundle carrying the Electron binary's own linker signature and nothing
  # sealing the contents, and `codesign --verify` rejects it. That is also what
  # electron-builder quietly falls back to when a named identity is missing,
  # hence `forceCodeSigning`: no certificate is a build error, not a warning.
  #
  # Distributing to other machines needs a real Apple certificate and
  # notarization instead (#57).
  identity: Agent Wrangler Local Signing
  forceCodeSigning: true
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dir
  extendInfo:
    # The app watches ~/.claude and spawns `claude` and `codex`; it reads no
    # documents and handles no URLs, so it declares nothing else.
    LSUIElement: false
